{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title }} — NIS2 Analyzer</title>
  <link rel="stylesheet" href="{% static 'marketing/css/base.css' %}">
  <link rel="stylesheet" href="{% static 'auth/css/auth.css' %}">
</head>
<body>
  <div class="auth-page" style="grid-template-columns:1fr;">
    <div class="auth-panel" style="max-width:640px;">
      <a href="{% url 'home' %}" class="auth-brand"><span class="glyph"></span> NIS2 Analyzer</a>
      <h1 class="auth-h1">{{ page_title }}</h1>
      <p class="auth-sub">{% trans "This page is being finalised. Contact support if you need a copy in the meantime." %}</p>
      <p class="auth-alt" style="text-align:left;margin-top:24px;">
        <a href="{% url 'signup' %}">{% trans "Create an account" %}</a> · <a href="{% url 'login' %}">{% trans "Log in" %}</a>
      </p>
    </div>
  </div>
</body>
</html>
