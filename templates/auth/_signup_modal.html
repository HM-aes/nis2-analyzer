<div x-data="signupModal()"
     x-on:open-signup.window="open()"
     x-cloak>

  <template x-if="isOpen">
    <div class="modal-overlay"
         x-trap.noscroll="isOpen"
         @keydown.escape.window="close()"
         @click.self="close()"
         x-transition.opacity.duration.200ms
         role="dialog" aria-modal="true" aria-labelledby="signup-modal-title">

      <div class="modal-card"
           x-transition:enter="transition ease-out duration-250"
           x-transition:enter-start="opacity-0 translate-y-3"
           x-transition:enter-end="opacity-100 translate-y-0">

        <div class="modal-head">
          <div>
            <h2 class="modal-title" id="signup-modal-title">Start your free assessment</h2>
            <p class="modal-sub">Create an account — no card, 2 minutes.</p>
          </div>
          <button type="button" class="modal-close" @click="close()" aria-label="Close dialog">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <div id="signup-modal-body"
             hx-get="{% url 'signup' %}"
             hx-trigger="load"
             hx-swap="innerHTML">
          <div class="auth-modal-loading" aria-live="polite">Loading…</div>
        </div>
      </div>
    </div>
  </template>
</div>

<script>
function signupModal(){
  return {
    isOpen:false,
    _opener:null,
    open(){
      this._opener = document.activeElement;
      this.isOpen = true;
    },
    close(){
      this.isOpen = false;
      this.$nextTick(()=>{ if(this._opener && this._opener.focus) this._opener.focus(); });
    }
  }
}
</script>
