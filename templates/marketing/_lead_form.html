{% load static %}
{% load i18n %}
<form
  class="lead-form"
  hx-post="{% url 'marketing:lead_capture' %}"
  hx-target="this"
  hx-swap="outerHTML"
  style="max-width:460px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
  {% csrf_token %}
  <input type="email" name="email" required placeholder="{% trans 'you@organisation.eu' %}" value="{{ request.POST.email|default:'' }}"
    style="flex:1;min-width:220px;padding:14px 16px;background:var(--panel-2);
           border:1px solid var(--line);border-radius:10px;color:var(--ink);
           font-family:inherit;font-size:15px;outline:none"
    onfocus="this.style.borderColor='var(--amber)'"
    onblur="this.style.borderColor='var(--line)'">
  <button type="submit" class="btn btn-primary btn-lg">{% trans "Start assessment" %}</button>
  {% if error %}
    <p class="mono" style="width:100%;font-size:13px;color:var(--amber);margin-top:4px">{{ error }}</p>
  {% endif %}
</form>
<p class="note" style="font-size:13px;color:var(--muted);margin-top:16px">
  {% trans "No spam. Your answers stay yours — we'll only email you the report." %}
</p>
