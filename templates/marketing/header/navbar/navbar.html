{# Marketing landing — navbar markup + Alpine.js. Styles: header/navbar/navbar.css #}
<nav id="site-nav" class="site-nav" aria-label="Main"
     x-data="{
       go(id) {
         const el = document.querySelector(id);
         if (!el) return;
         if (window.lenis) window.lenis.scrollTo(el, { offset: -70 });
         else window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 70, behavior: 'smooth' });
       }
     }">
  <div class="wrap">
    <div class="nav-bar-frame">
      <div class="nav-bar">
        <a href="/" class="nav-brand">
          <span class="nav-brand-glyph" aria-hidden="true"></span>
          <span class="nav-brand-text">NIS2&nbsp;Analyzer</span>
        </a>
        <div class="nav-links">
          <a href="#scope" class="nav-link nav-section" @click.prevent="go('#scope')">Am I in scope?</a>
          <a href="#audit" class="nav-link nav-section" @click.prevent="go('#audit')">What it checks</a>
          <a href="#deploy" class="nav-link nav-section" @click.prevent="go('#deploy')">Deployment</a>
          <a href="{% url 'login' %}" class="nav-link">Log in</a>
          <a href="{% url 'signup' %}" class="nav-link"
             @click.prevent="$dispatch('open-signup')">Sign up</a>
        </div>
      </div>
    </div>
  </div>
</nav>
